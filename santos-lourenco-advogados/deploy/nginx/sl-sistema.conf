# Nginx do Sistema Santos Lourenço Advogados
# Copiado para /etc/nginx/sites-available/sl-sistema.conf pelo deploy/instalar_vps.sh,
# que troca __DOMINIO__ pelo dominio real. HTTPS vem depois pelo certbot --nginx.
#
# Dominio: A CONFIRMAR (placeholder sistema.santoslourenco.adv.br)

server {
    listen 80;
    server_name __DOMINIO__;

    root /opt/santoslourenco/SISTEMA/frontend/dist;
    index index.html;
    client_max_body_size 25M;

    # cabecalhos basicos de seguranca
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # rota interna dos agentes (so chamada de dentro da VPS): nunca exposta
    location ^~ /api/agentes/hermes/ { return 404; }

    # API -> backend FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # producao de peca pode demorar
    }

    # webhook do WhatsApp (se o provedor chamar fora de /api)
    location /webhook/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health { proxy_pass http://127.0.0.1:8000/health; }

    # midia do chat (audios, fotos de contato) gravada pelo backend
    location /media/ {
        alias /opt/santoslourenco/media/;
        add_header Cache-Control "public, max-age=86400";
    }

    # Portal do Cliente
    location = /portal { return 301 /portal/; }
    location ^~ /portal/ {
        alias /opt/santoslourenco/SISTEMA/frontend/portal/;
        index index.html;
        try_files $uri $uri/ /portal/index.html;
        add_header Cache-Control "no-store" always;
    }

    # Area do colaborador e tela da equipe
    location = /colaborador { return 301 /colaborador/; }
    location ^~ /colaborador/ {
        alias /opt/santoslourenco/SISTEMA/frontend/colaborador/;
        index index.html;
        try_files $uri $uri/ /colaborador/index.html;
        add_header Cache-Control "no-store" always;
    }
    location = /equipe { return 301 /equipe/; }
    location ^~ /equipe/ {
        alias /opt/santoslourenco/SISTEMA/frontend/equipe/;
        index index.html;
        try_files $uri $uri/ /equipe/index.html;
        add_header Cache-Control "no-store" always;
    }

    # index.html nunca em cache (os blocos .js levam ?v= na URL)
    location = /index.html { add_header Cache-Control "no-store" always; }

    # SPA: qualquer rota cai no index.html
    location / { try_files $uri $uri/ /index.html; }
}
