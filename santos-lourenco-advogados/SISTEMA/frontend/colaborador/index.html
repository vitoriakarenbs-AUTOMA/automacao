<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4E0719">
<title>Minha área | Santos Lourenço Advogados</title>
<link rel="icon" type="image/png" href="/logo-sl-simbolo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  
  :root{--navy:#4E0719;--navy-2:#132f63;--ouro:#B08A35;--ouro-claro:#E8C77A;
    --verde:#0f9d58;--vermelho:#9b2222;
    --bg:#f5f3ee;--card:#fff;--texto:#182034;--suave:#5a6478;
    --linha:#e7e3da;--linha-2:#efece5;--chip:#eef2f8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--texto);font-size:15px;line-height:1.55;
    font-family:Montserrat,-apple-system,'Segoe UI',sans-serif}
  header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
  
  header img.logo{height:34px;width:auto;display:block}
  .marca{font-weight:800;font-size:14px;letter-spacing:.5px;line-height:1.2}
  .marca span{display:block;font-size:10px;color:var(--ouro-claro);letter-spacing:1.4px;text-transform:uppercase}
  header .quem{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--ouro-claro);color:var(--navy);
    display:grid;place-items:center;font-weight:800;font-size:13px}
  .sair{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;padding:7px 13px;
    font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  main{max-width:940px;margin:0 auto;padding:20px 16px 56px}
  h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--suave);font-size:13.5px;margin:0 0 18px}
  .cartao{background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:18px;margin-bottom:14px}
  .rotulo{font-size:11px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.8px;margin:0 0 4px}
  label{display:block;font-size:12px;font-weight:700;color:var(--navy);margin:0 0 5px;
    text-transform:uppercase;letter-spacing:.7px}
  input{width:100%;padding:12px;border:1.5px solid var(--linha);border-radius:10px;font-size:15px;
    font-family:inherit;background:#fff;color:var(--texto)}
  input:focus{outline:0;border-color:var(--navy-2)}
  .btn{font-family:inherit;font-size:15px;font-weight:700;border:0;border-radius:10px;padding:13px 22px;
    background:var(--navy-2);color:#fff;cursor:pointer}
  .btn:disabled{opacity:.5}
  .btn.saida{background:var(--vermelho)}
  .acao{font-family:inherit;font-size:13px;font-weight:700;border:1px solid var(--linha);background:transparent;
    color:var(--navy-2);border-radius:8px;padding:8px 13px;cursor:pointer}
  .ponto{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .ponto .dados{flex:1;min-width:180px}
  .relogio{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;
    padding:4px 11px;background:var(--chip);color:var(--texto)}
  .pill.ok{background:rgba(15,157,88,.14);color:var(--verde)}
  .pill.espera{background:#fbf1dc;color:#6d4c00}
  .pill.aberta{background:rgba(59,130,246,.16);color:#2563eb}
  nav.abas{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:4px}
  nav.abas button{font-family:inherit;font-size:13.5px;font-weight:600;white-space:nowrap;cursor:pointer;
    border:1px solid var(--linha);background:var(--card);color:var(--suave);border-radius:999px;padding:9px 16px}
  nav.abas button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
  .grade{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
  .campo .valor{font-weight:600}
  .item{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--linha)}
  .item:last-child{border-bottom:0}
  .item .meio{flex:1;min-width:0}
  .item .nome{font-weight:600;font-size:14px;overflow-wrap:anywhere}
  .item .meta{color:var(--suave);font-size:12.5px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--suave);
    padding:0 10px 8px 0;font-weight:700}
  td{padding:10px 10px 10px 0;border-top:1px solid var(--linha)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;padding-right:0}
  .rolagem{overflow-x:auto}
  .total{display:flex;justify-content:space-between;gap:12px;margin-top:14px;padding-top:12px;
    border-top:2px solid var(--linha);font-weight:700}
  .nota{font-size:12.5px;color:var(--suave);margin-top:10px}
  .aviso{background:#fbf1dc;border-radius:12px;padding:12px 14px;margin:0 0 14px;
    font-size:13.5px;line-height:1.45;color:#6d4c00}
  .erro{background:#fdecec;color:#9b2222;border-radius:10px;padding:11px 13px;font-size:13.5px;margin-top:12px}
  .vazio{color:var(--suave);font-size:13.5px;padding:8px 0}
  .entrada{max-width:420px;margin:12px auto 16px;text-align:center}
  .entrada .simbolo{height:58px;width:auto;margin:0 auto 14px;display:block}
  .entrada h1{color:var(--navy)}
  .entrada .sub{margin-bottom:0}
  @media (max-width:430px){.relogio{font-size:28px}.btn{width:100%}}
</style>
</head>
<body>
<header>
  <img src="/logo-sl-branco.png" alt="Santos Lourenço Advogados" class="logo">
  <div class="marca">SANTOS LOURENÇO ADVOGADOS<span>Minha área</span></div>
  <div class="quem" id="quem"></div>
</header>
<main id="app"></main>
<script>const $=s=>document.querySelector(s);let TOKEN=null,EU=null,FICHA=null;try{TOKEN=sessionStorage.getItem("sl_colab_token")}catch(e){}const esc=t=>String(t==null?"":t).replace(/[&<>"']/g,(c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])));const brl=v=>v==null?"·":"R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2});const dbr=d=>d?String(d).slice(0,10).split("-").reverse().join("/"):"·";const hm=min=>min==null?"·":Math.floor(min/60)+"h"+String(min%60).padStart(2,"0");const hora=ts=>new Date(ts*1e3).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});const SEM_PONTO=["Associado","Socio","PJ"];const VINCULO={Estagio:"Estágio",Socio:"Sócio",Aprendiz:"Jovem aprendiz",Prestador:"Prestador de serviços",Associado:"Associado",CLT:"CLT",PJ:"Pessoa jurídica",Autonomo:"Autônomo"};const maiuscula=t=>t?String(t).charAt(0).toUpperCase()+String(t).slice(1):t;async function api(caminho,opcoes={}){const cfg={method:opcoes.metodo||"GET",headers:{"Content-Type":"application/json"}};if(TOKEN)cfg.headers["Authorization"]="Bearer "+TOKEN;if(opcoes.corpo)cfg.body=JSON.stringify(opcoes.corpo);const r=await fetch(caminho,cfg);const d=await r.json().catch((()=>({})));if(r.status===401){sair();throw new Error("Sessão expirada. Entre de novo.")}if(!r.ok)throw new Error(d.detail||"Não consegui completar.");return d}function sair(){TOKEN=null;EU=null;FICHA=null;try{sessionStorage.removeItem("sl_colab_token")}catch(e){}$("#quem").innerHTML="";telaLogin()}function telaLogin(msg){$("#app").innerHTML=`\n    <div class="entrada">\n      <img src="/logo-sl-simbolo.png" alt="" class="simbolo">\n      <h1>Minha área</h1>\n      <p class="sub">Entre com o seu login do Sistema Santos Lourenço.</p>\n    </div>\n    <div class="cartao" style="max-width:420px;margin:0 auto">\n      <div style="margin-bottom:12px"><label for="em">E-mail</label>\n        <input id="em" type="email" autocomplete="username"></div>\n      <div style="margin-bottom:16px"><label for="se">Senha</label>\n        <input id="se" type="password" autocomplete="current-password"></div>\n      <button class="btn" id="btnEntrar" style="width:100%">Entrar</button>\n      <div id="msg">${msg?'<div class="erro">'+esc(msg)+"</div>":""}</div>\n    </div>`;$("#se").onkeydown=e=>{if(e.key==="Enter")$("#btnEntrar").click()};$("#btnEntrar").onclick=async()=>{const b=$("#btnEntrar");b.disabled=true;try{const r=await api("/api/auth/login",{metodo:"POST",corpo:{email:$("#em").value.trim(),senha:$("#se").value}});TOKEN=r.token;try{sessionStorage.setItem("sl_colab_token",r.token)}catch(e){}await abrir()}catch(e){$("#msg").innerHTML='<div class="erro">'+esc(e.message)+"</div>";b.disabled=false}}}async function abrir(){EU=await api("/api/rh/eu");if(!EU.colaborador){sair();return telaLogin("O seu login ainda não tem ficha de RH. Fale com a administração.")}FICHA=await api("/api/rh/colaboradores/"+EU.colaborador.id);const iniciais=(FICHA.nome||"").split(" ").filter(Boolean).slice(0,2).map((p=>p[0])).join("").toUpperCase();$("#quem").innerHTML=`<span class="avatar">${esc(iniciais)}</span> ${esc((FICHA.nome||"").split(" ")[0])}\n    <button class="sair" id="btnSair">Sair</button>`;$("#btnSair").onclick=sair;desenhar()}function bateponto(){return!SEM_PONTO.includes(FICHA.tipo_contrato||"")&&!/^n[aã]o bate ponto/i.test(FICHA.jornada||"")}function desenhar(){const abas=[["contrato","Meu contrato"],["documentos","Documentos"]];if(FICHA.tipo_contrato==="CLT")abas.push(["holerites","Holerites"]);abas.push(["pagamentos","Pagamentos"],["comissoes","Comissões"]);if(bateponto())abas.push(["espelho","Espelho do mês"]);$("#app").innerHTML=`\n    <h1>Olá, ${esc((FICHA.nome||"").split(" ")[0])}</h1>\n    <p class="sub">${esc(FICHA.cargo||"Equipe Santos Lourenço")}${FICHA.data_admissao?" desde "+dbr(FICHA.data_admissao):""}.</p>\n    <div id="caixaPonto"></div>\n    <nav class="abas" role="tablist">${abas.map((([k,r],i)=>`<button role="tab" data-aba="${k}" aria-selected="${i===0}">${r}</button>`)).join("")}</nav>\n    <div id="conteudo"></div>`;document.querySelectorAll("nav.abas button").forEach((b=>{b.onclick=()=>{document.querySelectorAll("nav.abas button").forEach((o=>o.setAttribute("aria-selected",String(o===b))));painel(b.dataset.aba)}}));if(bateponto())caixaPonto();painel("contrato")}async function caixaPonto(){const c=$("#caixaPonto");c.innerHTML='<div class="cartao"><p class="rotulo">Ponto de hoje</p><div class="vazio">Carregando…</div></div>';try{const d=await api("/api/rh/ponto/hoje");const meu=(d.equipe||[]).find((x=>x.id===FICHA.id))||{marcas:[],minutos:0,situacao:"sem_registro"};const trabalhando=meu.situacao==="trabalhando";const rotulo={trabalhando:"Trabalhando agora",saiu:"Expediente encerrado",sem_registro:"Ainda não bateu hoje"};c.innerHTML=`\n      <div class="cartao"><div class="ponto">\n        <div class="dados">\n          <p class="rotulo">Ponto de hoje</p>\n          <div class="relogio">${hm(meu.minutos)}</div>\n          <div class="meta" style="color:var(--suave);font-size:13px">${meu.marcas.length?meu.marcas.map((m=>(m.tipo==="entrada"?"Entrada ":"Saída ")+hora(m.ts))).join(" · "):"Nenhuma marcação hoje"}</div>\n          <p style="margin:10px 0 0"><span class="pill ${trabalhando?"aberta":meu.marcas.length?"ok":""}">${rotulo[meu.situacao]||meu.situacao}</span></p>\n        </div>\n        <button class="btn ${trabalhando?"saida":""}" id="btnBater">${trabalhando?"Bater saída":"Bater entrada"}</button>\n      </div><div id="msgPonto"></div></div>`;$("#btnBater").onclick=async()=>{const b=$("#btnBater");b.disabled=true;try{await api("/api/rh/ponto/bater",{metodo:"POST"});await caixaPonto()}catch(e){$("#msgPonto").innerHTML='<div class="erro">'+esc(e.message)+"</div>";b.disabled=false}}}catch(e){c.innerHTML='<div class="cartao"><div class="erro">'+esc(e.message)+"</div></div>"}}async function baixar(did,nome){const r=await fetch("/api/rh/documentos/"+did+"/arquivo",{headers:{Authorization:"Bearer "+TOKEN}});if(!r.ok){alert("Não consegui abrir o arquivo.");return}const url=URL.createObjectURL(await r.blob());const a=document.createElement("a");a.href=url;a.download=nome||"documento.pdf";document.body.appendChild(a);a.click();a.remove();setTimeout((()=>URL.revokeObjectURL(url)),4e3)}function listaDocs(docs,vazio){if(!docs.length)return'<div class="vazio">'+vazio+"</div>";return docs.map((d=>`<div class="item"><div class="meio">\n      <div class="nome">${esc(d.nome)}</div>\n      <div class="meta">${esc(d.tipo||"Documento")} · ${dbr(d.enviado_em)}${d.tamanho?" · "+Math.round(d.tamanho/1024)+" KB":""}</div></div>\n    <button class="acao" data-doc="${d.id}" data-nome="${esc(d.nome)}">Abrir</button></div>`)).join("")}function ligarBotoesDoc(){document.querySelectorAll("[data-doc]").forEach((b=>{b.onclick=()=>baixar(b.dataset.doc,b.dataset.nome)}))}async function painel(aba){const alvo=$("#conteudo");alvo.innerHTML='<div class="cartao"><div class="vazio">Carregando…</div></div>';try{if(aba==="contrato"){const campos=[["Vínculo",VINCULO[FICHA.tipo_contrato]||FICHA.tipo_contrato],["Cargo",FICHA.cargo],["Setor",FICHA.setor],["Admissão",dbr(FICHA.data_admissao)],["Jornada",FICHA.jornada],[FICHA.tipo_contrato==="Estagio"?"Bolsa-auxílio":SEM_PONTO.includes(FICHA.tipo_contrato||"")||FICHA.tipo_contrato==="Prestador"?"Remuneração combinada":"Salário",FICHA.salario?brl(FICHA.salario):null],["Situação",maiuscula(FICHA.status)]];alvo.innerHTML=`<div class="cartao"><p class="rotulo">Meu contrato</p><div class="grade">${campos.filter((([,v])=>v)).map((([r,v])=>`<div class="campo"><p class="rotulo">${r}</p><div class="valor">${esc(v)}</div></div>`)).join("")}</div>\n        <p class="nota">Encontrou algo errado? Fale com a administração do escritório.</p></div>`;return}if(aba==="documentos"||aba==="holerites"){const d=await api("/api/rh/colaboradores/"+FICHA.id+"/documentos");const todos=d.documentos||d||[];const holerite=x=>/holerite|recibo de pagamento|folha/i.test((x.tipo||"")+" "+(x.nome||""));const lista=aba==="holerites"?todos.filter(holerite):FICHA.tipo_contrato==="CLT"?todos.filter((x=>!holerite(x))):todos;alvo.innerHTML=`<div class="cartao"><p class="rotulo">${aba==="holerites"?"Meus holerites":"Meus documentos"}</p>\n        ${listaDocs(lista,aba==="holerites"?"Nenhum holerite por aqui ainda. Assim que a contabilidade enviar, ele aparece nesta tela.":"Nenhum documento guardado até agora.")}</div>`;ligarBotoesDoc();return}if(aba==="pagamentos"){const d=await api("/api/rh/pagamentos");const itens=d.pagamentos||[],anos=d.anos||[];const divisao=d.observacao?`<div class="aviso">${esc(d.observacao)}</div>`:"";if(!itens.length){alvo.innerHTML=`<div class="cartao"><p class="rotulo">Demonstrativo de pagamentos</p>\n          ${divisao}\n          <div class="vazio">${esc(d.aviso||"Nenhum pagamento registrado até agora. Assim que o escritório lançar o primeiro, ele aparece nesta tela.")}</div></div>`;return}alvo.innerHTML=`<div class="cartao"><p class="rotulo">Demonstrativo de pagamentos</p>\n        ${divisao}\n        <div class="grade" style="margin-bottom:16px">${anos.map((a=>`<div class="campo"><p class="rotulo">Recebido em ${esc(a.ano)}</p>\n            <div class="valor">${brl(a.total)}</div>\n            <div class="meta" style="color:var(--suave);font-size:12.5px">${a.qtd} pagamento${a.qtd>1?"s":""}</div></div>`)).join("")}</div>\n        <div class="rolagem"><table>\n          <thead><tr><th>Pago em</th><th>Competência</th><th>Tipo</th><th class="num">Valor</th></tr></thead>\n          <tbody>${itens.map((i=>`<tr><td>${dbr(i.data_pagamento)}</td>\n            <td>${esc(i.competencia||"·")}</td><td>${esc(i.rotulo||"Pagamento")}</td>\n            <td class="num">${brl(i.valor)}</td></tr>`)).join("")}</tbody></table></div>\n        <div class="total"><span>Total recebido</span><span>${brl(d.total)}</span></div>\n        <p class="nota">Sai do financeiro do escritório e entra só o que já foi pago de verdade, com a data em que\n        saiu da conta. Pagamento programado para os próximos meses não aparece aqui.${d.sincronizado_em?" Última conferência em "+new Date(d.sincronizado_em*1e3).toLocaleString("pt-BR")+".":""}</p></div>`;return}if(aba==="comissoes"){let mesa=null;try{mesa=await api("/api/comercial/minha-mesa")}catch(e){mesa=null}if(mesa&&mesa.vendedora){const c=mesa.comissao||{},dist=mesa.distribuicao||{};alvo.innerHTML=`<div class="cartao"><p class="rotulo">Minhas comissões</p>\n          <div class="grade">\n            <div class="campo"><p class="rotulo">Liberada no mês</p><div class="valor">${brl(c.liberada_mes)}</div></div>\n            <div class="campo"><p class="rotulo">Liberada no total</p><div class="valor">${brl(c.liberada)}</div></div>\n            <div class="campo"><p class="rotulo">Aguardando distribuição</p><div class="valor">${brl(c.a_liberar)}</div></div>\n            <div class="campo"><p class="rotulo">Por contrato</p><div class="valor">${brl(c.taxa)}</div></div>\n          </div>\n          <div class="rolagem" style="margin-top:14px"><table>\n            <thead><tr><th>Contrato</th><th>Situação</th></tr></thead><tbody>\n            ${(dist.distribuidos||[]).map((x=>`<tr><td>${esc(x.cliente)}</td>\n              <td><span class="pill ok">Liberada em ${esc(x.em)}</span></td></tr>`)).join("")}\n            ${(dist.pendentes||[]).map((x=>`<tr><td>${esc(x.cliente)}</td>\n              <td><span class="pill espera">${esc(x.etapa||"aguarda a distribuição")}</span></td></tr>`)).join("")}\n            </tbody></table></div>\n          <p class="nota">A comissão nasce quando o contrato é distribuído para a produção, depois entra na folha e, por último,\n          aparece no holerite. Cada contrato passa uma vez só por esse caminho.</p></div>`;return}const d=await api("/api/rh/colaboradores/"+FICHA.id+"/documentos");const todos=d.documentos||d||[];const rem=todos.filter((x=>/remunera|comiss|demonstrativo|repasse/i.test((x.nome||"")+" "+(x.tipo||""))));alvo.innerHTML=`<div class="cartao"><p class="rotulo">Minha remuneração</p>\n        ${listaDocs(rem,"Nenhuma apuração guardada até agora. Quando o escritório fechar o mês, ela aparece aqui.")}\n        <p class="nota">As apurações ficam na sua pasta do escritório e abrem por esta tela.</p></div>`;ligarBotoesDoc();return}if(aba==="espelho"){const mes=(new Date).toISOString().slice(0,7);const d=await api("/api/rh/ponto?mes="+mes);const linhas=(d.dias||[]).slice().reverse();alvo.innerHTML=`<div class="cartao"><p class="rotulo">Espelho do mês</p>\n        <div class="rolagem"><table>\n          <thead><tr><th>Dia</th><th>Marcações</th><th class="num">Horas</th><th>Situação</th></tr></thead>\n          <tbody>${linhas.length?linhas.map((l=>`<tr><td>${dbr(l.dia)}</td>\n            <td>${l.marcas.map((m=>(m.tipo==="entrada"?"E ":"S ")+hora(m.ts))).join(" · ")}</td>\n            <td class="num">${hm(l.minutos)}</td>\n            <td>${l.incompleto?'<span class="pill espera">Falta bater a saída</span>':'<span class="pill ok">Completo</span>'}</td></tr>`)).join(""):'<tr><td colspan="4" class="vazio">Nenhuma marcação neste mês.</td></tr>'}</tbody></table></div>\n        <div class="total"><span>Trabalhadas no mês</span><span>${hm(d.minutos_mes)}</span></div>\n        <p class="nota">Esqueceu de bater? Avise o escritório. O ajuste fica registrado com quem lançou e o motivo.</p></div>`;return}}catch(e){alvo.innerHTML='<div class="cartao"><div class="erro">'+esc(e.message)+"</div></div>"}}(async()=>{if(TOKEN){try{await abrir()}catch(e){telaLogin()}}else telaLogin()})();</script>
</body>
</html>
