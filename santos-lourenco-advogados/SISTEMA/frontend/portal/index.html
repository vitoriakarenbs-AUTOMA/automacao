<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script id="tp-escolha">(function(){var t="claro";try{t=localStorage.getItem("sl_portal_tema")||"claro"}catch(e){}document.documentElement.setAttribute("data-tp",t==="escuro"?"escuro":"claro")})();</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4E0719">
<title>Portal do Cliente | Santos Lourenço Advogados</title>
<link rel="manifest" href="/portal/manifest.json">
<link rel="icon" href="/portal/icone.svg">
<link rel="apple-touch-icon" href="/portal/icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Processo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
  :root{
    --navy:#4E0719; --navy-2:#7A1427; --gold:#B08A35; --gold-claro:#E8C77A;
    
    --azul:#2563eb;
    
    --bg:#f5f3ee; --card:#fff; --texto:#182034;
    
    --suave:#5a6478;
    --linha:#e7e3da;      
    --linha-2:#efece5;
    --ok:#0f9d58; --alerta:#c47f17;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--texto);
    font-family:Montserrat,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:15px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom)}
  h1,h2,h3{margin:0;font-weight:700;line-height:1.25}
  button{font-family:inherit;font-size:15px;cursor:pointer;border:0}
  a{color:var(--navy-2)}
  .oculto{display:none!important}

  
  .ps{display:grid;gap:14px;padding-top:8px}
  .ps-contexto{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--suave);margin:2px 2px 0}
  .ps-contra{font-size:22px;font-weight:800;color:var(--navy);line-height:1.2;margin:2px 2px 0;
    text-wrap:balance;text-transform:capitalize}
  .ps-status{background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:18px}
  .ps-sobre{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8a6400}
  .ps-manchete{font-size:21px;font-weight:800;line-height:1.25;color:var(--navy);
    margin:8px 0 6px;text-wrap:balance}
  .ps-texto{font-family:'Atkinson Hyperlegible',Verdana,sans-serif;font-size:18px;line-height:1.5;
    margin:0;color:var(--texto)}
  .ps-quando{font-size:13px;color:var(--suave);margin-top:10px}
  .ps-aviso{background:#fbf1dc;border-radius:14px;padding:12px 14px;margin-top:14px;
    font-family:'Atkinson Hyperlegible',Verdana,sans-serif;font-size:16.5px;line-height:1.45;color:#6d4c00}
  .ps-ouvir{width:100%;margin-top:14px;min-height:54px;border-radius:14px;border:2px solid var(--navy);
    background:#fff;color:var(--navy);font-weight:800;font-size:16px;display:flex;
    align-items:center;justify-content:center;gap:10px}
  .ps-ouvir[aria-pressed="true"]{background:var(--navy);color:#fff}
  .ps-voz-aviso{font-size:13px;color:var(--suave);margin:6px 2px 0;min-height:0}
  
  .duv-falar{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;
    border-radius:13px;background:#128C7E;color:#fff;font-weight:800;font-size:16px}
  .duv-falar.gravando{background:#c0392b}
  .duv-falar:disabled{opacity:.8}
  .duv-falar[hidden],.duv-cancelar[hidden],.duv-ou[hidden]{display:none}
  .duv-cancelar{display:block;margin:8px auto 0;background:none;color:#3c6b60;text-decoration:underline;
    font-size:14px;padding:4px 8px}
  .duv-voz-aviso{font-size:14.5px;color:#0f5a4a;margin:8px 2px 0;line-height:1.45}
  .duv-voz-aviso:empty{display:none}
  
  .duv-voz-aviso.forte{font-size:17px;font-weight:700;color:#7a1f14;background:#fdecea;
    border:2px solid #e0a39c;border-radius:12px;padding:14px 16px;margin-top:12px}
  .duv-ou{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#456e61;margin:12px 0 10px}
  .duv-ou::before,.duv-ou::after{content:"";flex:1;height:1px;background:#cdeae2}
  .duv-perguntou{margin-top:14px;background:#fff;border:1px dashed #cdeae2;border-radius:11px;padding:10px 12px}
  .duv-perguntou small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.09em;
    text-transform:uppercase;color:var(--suave)}
  .duv-perguntou p{margin:2px 0 0;font-family:'Atkinson Hyperlegible',Verdana,sans-serif;font-size:16px}
  .duv-perguntou + .duvida-resp{margin-top:10px}
  .duv-ouvir{min-height:50px;font-size:15px}
  .ps-caso{background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:18px}
  .ps-caso-texto{font-family:'Atkinson Hyperlegible',Verdana,sans-serif;font-size:17.5px;line-height:1.55;
    margin:8px 0 0;color:var(--texto)}
  .ps-caso-texto.preparando{color:#98a2b3;font-style:italic}

  
  .pp{display:grid;gap:14px;padding-top:4px}
  .pp-ola .ps-contexto{margin:0}
  .pp-nome{margin:2px 0 0;font-size:23px;font-weight:800;color:var(--navy);line-height:1.2;
    text-transform:capitalize;text-wrap:balance}
  .pp-ola p{margin:8px 0 0;font-family:'Atkinson Hyperlegible',Verdana,sans-serif;font-size:17.5px;line-height:1.4}
  .pp-card{background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:18px}
  .pp-card .ps-sobre{margin:0 0 10px}
  .pp-s{margin:10px 2px 0;font-family:'Atkinson Hyperlegible',Verdana,sans-serif;font-size:15px;color:var(--suave);line-height:1.45}
  .pp-s.preparando{margin:0;font-style:italic;color:#98a2b3}
  .pp-sub{margin:14px 0 4px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--suave)}
  .pp-sub:first-child{margin-top:0}
  .pp-sub.verm{color:#9b2222}
  .pp-chip{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;
    background:#fbf1dc;color:#8a6400;white-space:nowrap}
  .pp-chip.verm{background:#fdecec;color:#9b2222}
  .pp-cp{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--linha-2);position:relative}
  .pp-cp:first-child{border-top:0;padding-top:2px}
  .pp-cp.escondido{display:none}
  .pp-cp-data{background:var(--navy);color:#fff;border-radius:12px;text-align:center;padding:8px 4px;align-self:start}
  .pp-cp-data b{display:block;font-size:22px;line-height:1}
  .pp-cp-data span{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;margin-top:2px;color:var(--gold-claro)}
  .pp-cp-data small{display:block;font-size:11.5px;opacity:.85;margin-top:3px}
  .pp-cp-t{margin:0;font-weight:800;color:var(--navy);font-size:16.5px;padding-right:84px}
  .pp-cp-q{margin:2px 0 0;font-size:14px;color:var(--suave)}
  .pp-cp-prep{margin:8px 0 0;font-family:'Atkinson Hyperlegible',Verdana,sans-serif;font-size:15px;line-height:1.35;
    color:#7a5a12;background:#fbf1dc;border-radius:10px;padding:8px 10px}
  .pp-cp-local{margin:6px 0 0;font-size:12.5px;color:#8a91a0}
  .pp-cp-quando{position:absolute;right:0;top:12px}
  .pp-cp:first-child .pp-cp-quando{top:2px}
  .pp-mais{background:none;color:var(--azul);font-weight:700;padding:8px 0 0;text-decoration:underline}
  .pp-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .pp-nums button{background:#fff;border:1px solid var(--linha-2);border-radius:14px;padding:12px 6px;text-align:center}
  .pp-nums b{display:block;font-size:30px;line-height:1.1;color:var(--navy)}
  .pp-nums .and b{color:#c0392b}
  .pp-nums .enc b{color:#0f7a4a}
  .pp-nums span{font-size:13px;color:var(--suave)}
  .pp-fig{margin:0;font-size:32px;font-weight:800;color:#0f7a4a;line-height:1.1;font-variant-numeric:tabular-nums}
  .pp-fig-s{margin:6px 0 0;font-family:'Atkinson Hyperlegible',Verdana,sans-serif;font-size:16.5px;line-height:1.4}
  .pp-barras{margin-top:14px;display:grid;gap:10px}
  .pp-barra-l{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--suave);margin-bottom:4px}
  .pp-barra-l b{color:var(--texto);font-variant-numeric:tabular-nums}
  .pp-trilho{height:14px;border-radius:7px;background:var(--linha-2);overflow:hidden}
  .pp-trilho i{display:block;height:100%;border-radius:7px}
  .pp-dobra{margin-top:12px;border-top:1px solid var(--linha-2)}
  .pp-dobra>summary{cursor:pointer;list-style:none;padding:12px 0 4px;font-weight:800;color:var(--navy);
    font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .pp-dobra>summary::-webkit-details-marker{display:none}
  .pp-dobra>summary::after{content:"+";font-size:22px;line-height:1;font-weight:600}
  .pp-dobra[open]>summary::after{content:"\2212"}
  .pp-bl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--linha-2)}
  .pp-sub + .pp-bl{border-top:0;padding-top:4px}
  .pp-bl-t{margin:0;font-weight:700;font-size:15px;color:var(--texto)}
  .pp-bl-s{margin:2px 0 0;font-size:13.5px;color:var(--suave);font-variant-numeric:tabular-nums}
  .pp-bl-acoes{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:4px}
  .pp-bl-acoes a{font-weight:700;font-size:14px;color:var(--azul)}
  .pp-pago{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--linha-2);font-size:14px}
  .pp-pago i{display:block;font-style:normal;color:var(--suave);font-size:13px}
  .pp-pago-r{text-align:right;color:var(--suave);font-size:13px}
  .pp-pago-r a{display:block;color:var(--azul);font-weight:700}
  .pp-cons{list-style:none;margin:0;padding:0}
  .pp-cons li{padding:10px 0;border-top:1px solid var(--linha-2)}
  .pp-cons li:first-child{border-top:0;padding-top:0}
  .pp-cons b{display:block;color:var(--navy);font-size:15.5px}
  .pp-cons small{display:block;font-size:12.5px;font-weight:700;color:#8a6400;margin-top:1px}
  .pp-cons span{display:block;font-family:'Atkinson Hyperlegible',Verdana,sans-serif;font-size:14.5px;color:var(--suave);line-height:1.35;margin-top:2px}
  .pp-casos{list-style:none;margin:0;padding:0}
  .pp-casos li{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--linha-2)}
  .pp-casos li:first-child{border-top:0}
  .pp-data{font-size:13px;font-weight:800;color:#8a6400;font-variant-numeric:tabular-nums}
  .pp-casos b{font-size:15px;color:var(--navy);font-weight:700}
  .pp-btn2{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:13px;
    border:2px solid var(--navy);background:#fff;color:var(--navy);font-weight:800;font-size:15px}
  .pp-rod{text-align:center;font-size:13px;color:var(--suave);margin:0}
  .pp-nums button:focus-visible,.pp-btn2:focus-visible,.pp-dobra>summary:focus-visible,.pp-mais:focus-visible,
  .pp-bl-acoes a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .duv-falar:focus-visible,.duv-cancelar:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .ps-caminho{background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:16px 18px}
  .ps-caminho h3{font-size:15px;font-weight:800;color:var(--navy);margin:0 0 12px}
  .ps-caminho ol{list-style:none;margin:0;padding:0}
  .ps-caminho li{display:grid;grid-template-columns:26px 1fr;gap:12px;position:relative;padding-bottom:16px}
  .ps-caminho li:last-child{padding-bottom:0}
  .ps-caminho li::before{content:"";position:absolute;left:12px;top:26px;bottom:0;width:2px;background:var(--linha)}
  .ps-caminho li:last-child::before{display:none}
  .ps-marca{width:26px;height:26px;border-radius:50%;border:2px solid #cfc8b8;background:#fff;
    position:relative;z-index:1}
  .ps-caminho li.feito .ps-marca{background:var(--navy);border-color:var(--navy)}
  .ps-caminho li.agora .ps-marca{border:7px solid var(--gold)}
  .ps-passo{font-family:'Atkinson Hyperlegible',Verdana,sans-serif;font-size:17px;line-height:1.3;padding-top:2px}
  .ps-passo small{display:block;font-size:14px;color:var(--suave)}
  .ps-caminho li.futuro .ps-passo{color:var(--suave)}
  .ps-caminho li.talvez .ps-marca{border-style:dashed;border-color:var(--navy);background:#fff}
  .ps-caminho li.talvez .ps-passo{color:var(--suave)}
  .ps-opc{font-size:13.5px;font-weight:400;color:var(--suave)}
  .ps-passo small.ps-explica{font-size:13.5px;line-height:1.35;color:#7a5a12;margin-top:3px}
  .ps-aqui{display:inline-block;margin-top:4px;font-family:Montserrat,sans-serif;font-size:11px;
    font-weight:800;background:var(--navy);color:#fff;padding:3px 9px;border-radius:999px}
  .ps-acoes{display:grid;gap:10px}
  .ps-acao{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:0 16px;
    border-radius:14px;background:#fff;border:2px solid var(--linha);color:var(--navy);
    font-weight:800;font-size:16px;text-decoration:none;text-align:left}
  .ps-acao.zap{background:#128c4a;border-color:#128c4a;color:#fff}
  .ps-acao.ouro{background:#c98500;border-color:#c98500;color:#fff}
  .ps-acao svg{flex:none}
  .ps-acao:disabled{opacity:.6}
  .ps-dobra{background:var(--card);border:1px solid var(--linha);border-radius:16px}
  .ps-dobra>summary{cursor:pointer;list-style:none;padding:15px 16px;font-weight:800;font-size:15px;
    color:var(--navy);display:flex;justify-content:space-between;align-items:center;gap:12px}
  .ps-dobra>summary::-webkit-details-marker{display:none}
  .ps-dobra>summary::after{content:"+";font-size:22px;line-height:1;font-weight:600}
  .ps-dobra[open]>summary::after{content:"\2212"}
  .ps-dentro{padding:0 16px 16px}
  .ps-dentro p{font-family:'Atkinson Hyperlegible',Verdana,sans-serif;font-size:17px;line-height:1.55;margin:0}
  .ps-dentro p.preparando{color:#98a2b3;font-style:italic}
  .ps-dados{display:grid;gap:12px;margin:0}
  .ps-dados dt{font-size:13px;color:var(--suave)}
  .ps-dados dd{margin:2px 0 0;font-family:'Atkinson Hyperlegible',Verdana,sans-serif;font-size:16.5px}
  .ps-dados dd.nome{text-transform:capitalize}
  .ps-link{display:block;width:100%;background:none;text-align:center;font-size:14.5px;font-weight:600;
    color:var(--suave);text-decoration:underline;padding:10px}
  .ps-link.ps-processo{font-size:19px;font-weight:800;color:var(--azul);text-transform:uppercase;
    letter-spacing:.04em;text-decoration-thickness:2px;text-underline-offset:5px;padding:16px 10px 4px}
  .ps-processo-nota{text-align:center;font-size:14px;color:var(--suave);margin:0 12px 8px}
  .ps-ouvir:focus-visible,.ps-acao:focus-visible,.ps-dobra>summary:focus-visible,.ps-link:focus-visible{
    outline:3px solid var(--gold);outline-offset:3px}

  
  .pl{display:grid;gap:14px;padding-top:4px}
  .pl-ola h2{margin:0;font-size:24px;font-weight:800;color:var(--navy)}
  .pl-ola p{margin:4px 0 0;font-family:'Atkinson Hyperlegible',Verdana,sans-serif;font-size:17.5px;line-height:1.4}
  .pl-card{background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:18px;display:grid;gap:14px;cursor:pointer}
  .pl-card .ps-contexto{margin:0}
  .pl-nome{font-size:21px;font-weight:800;color:var(--navy);line-height:1.2;margin-top:2px;text-wrap:balance;text-transform:capitalize}
  .pl-agora{font-family:'Atkinson Hyperlegible',Verdana,sans-serif}
  .pl-sobre{display:block;font-family:Montserrat,sans-serif;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8a6400}
  .pl-agora b{display:block;font-size:19px;color:var(--navy);line-height:1.25;margin-top:2px}
  .pl-agora small{display:block;font-size:15.5px;color:var(--suave);margin-top:1px}
  .pl-barra{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .pl-barra i{height:10px;border-radius:5px;background:#e4dfd3}
  .pl-barra i.feito{background:var(--navy)}
  .pl-barra i.agora{background:var(--gold)}
  .pl-barra i.talvez{background:#fff;border:2px dashed #9aa3b5}
  .pl-etapa{display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;font-size:13.5px;color:var(--suave);margin-top:7px}
  .pl-explica{margin:-4px 0 0;font-family:'Atkinson Hyperlegible',Verdana,sans-serif;font-size:15px;line-height:1.35;
    color:#7a5a12;background:#fbf1dc;border-radius:12px;padding:10px 12px}
  .pl-rodape{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-size:13.5px;color:var(--suave)}
  .pl-chip{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12.5px;padding:4px 10px;border-radius:999px}
  .pl-chip.seg{background:#efe9fb;color:#5b3a9e}
  .pl-chip.doc{background:#e8f3ec;color:#17693f}
  .pl-ver{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:54px;padding:0 18px;
    border-radius:14px;background:var(--navy);color:#fff;font-weight:800;font-size:16px}
  .pl-ver span{font-size:26px;line-height:1}
  .pl-num{font-size:12.5px;color:#8a91a0;text-align:center;margin-top:-6px;font-variant-numeric:tabular-nums}
  .pl-enc{background:var(--card);border:1px solid var(--linha);border-radius:16px}
  .pl-enc summary{cursor:pointer;list-style:none;padding:16px 18px;font-weight:800;font-size:15.5px;color:var(--navy);
    display:flex;justify-content:space-between;align-items:center;gap:12px}
  .pl-enc summary::-webkit-details-marker{display:none}
  .pl-enc summary::after{content:"+";font-size:22px;line-height:1;font-weight:600}
  .pl-enc[open] summary::after{content:"\2212"}
  .pl-enc ul{list-style:none;margin:0;padding:0 18px 10px}
  .pl-enc li{border-top:1px solid var(--linha-2)}
  .pl-enc li button{display:block;width:100%;background:none;text-align:left;padding:11px 0;font-size:15px;color:var(--texto)}
  .pl-enc .nomec{text-transform:capitalize}
  .pl-enc small{display:block;color:#8a91a0;font-size:12.5px}
  .pl-ver:focus-visible,.pl-enc summary:focus-visible,.pl-enc li button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

  
  .btn-2:disabled{opacity:.65;cursor:default}
  .link-cpf{display:block;margin:10px auto 0;background:none;color:var(--suave);text-decoration:underline;
    font-size:14px;padding:6px 8px}
  .ajuda-entrar{margin-top:14px;padding-top:14px;border-top:1px solid var(--linha)}
  .ajuda-entrar p{margin:0 0 10px;font-size:14.5px;color:var(--suave)}
  .ajuda-entrar .ps-acao{min-height:52px}

  
  header{background:var(--navy);color:#fff;padding:14px 18px;display:flex;
    align-items:center;gap:12px;position:sticky;top:0;z-index:20;
    padding-top:calc(14px + env(safe-area-inset-top))}
  .marca{font-weight:800;letter-spacing:.5px;font-size:15px}
  .marca span{color:var(--gold-claro);font-weight:600;display:block;font-size:11px;
    letter-spacing:1.5px;text-transform:uppercase}

:root { --azul: #74A2F0; }


body { background: transparent !important; color: var(--tx) !important; font-family: var(--corpo) !important; }

html {
  background-color: var(--f) !important; min-height: 100%;
  background-image:
    linear-gradient(var(--grade) 1px, transparent 1px),
    linear-gradient(90deg, var(--grade) 1px, transparent 1px),
    linear-gradient(var(--grade-fina) 1px, transparent 1px),
    linear-gradient(90deg, var(--grade-fina) 1px, transparent 1px) !important;
  background-size: 64px 64px, 64px 64px, 16px 16px, 16px 16px !important;
}
body::before {
  content: ""; position: fixed; inset: -10%; z-index: -1; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 45% at 18% 4%, color-mix(in srgb, var(--petroleo) 13%, transparent), transparent 70%),
    radial-gradient(ellipse 55% 50% at 88% 2%, color-mix(in srgb, var(--azul) 16%, transparent), transparent 70%),
    radial-gradient(ellipse 90% 60% at 50% 100%, color-mix(in srgb, var(--azul3) 14%, transparent), transparent 70%);
}
#app, #app *, header, header *, .leitor, .leitor *, .tg-balao, .tg-balao * { font-family: var(--corpo); }
h1, h2, h3 { font-family: var(--cond) !important; font-weight: 700 !important; letter-spacing: .015em; color: var(--tx-forte); }
::selection { background: color-mix(in srgb, var(--azul) 35%, transparent); }
*::-webkit-scrollbar-thumb { background: var(--borda); border-radius: 6px; }
:focus-visible { outline: 3px solid var(--azul) !important; outline-offset: 2px !important; box-shadow: none !important; }
a { color: var(--azul2); }


header {
  background: linear-gradient(90deg, color-mix(in srgb, var(--azul) 14%, transparent), color-mix(in srgb, var(--s2) 92%, transparent) 30%, color-mix(in srgb, var(--s2) 92%, transparent) 70%, color-mix(in srgb, var(--petroleo) 12%, transparent)), var(--s1) !important;
  border: 1px solid color-mix(in srgb, var(--azul) 32%, transparent) !important;
  border-radius: 999px !important; color: var(--tx) !important;
  box-shadow: 0 10px 30px var(--sombra-topo), inset 0 1px 0 var(--brilho-1), 0 0 0 4px color-mix(in srgb, var(--f) 60%, transparent) !important;
  padding-left: 22px !important; padding-right: 10px !important; gap: 10px !important; position: sticky; z-index: 20;
}
header::before {
  content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--verde); box-shadow: 0 0 10px var(--verde);
}
header img.logo { display: none !important; }

.marca {
  display: grid; grid-template-columns: auto auto; column-gap: 10px; row-gap: 0; align-items: center; justify-content: start;
  white-space: nowrap;
  font-family: var(--cond) !important; font-weight: 700 !important; font-size: 22px !important; line-height: 1 !important;
  letter-spacing: .03em !important; text-transform: uppercase; color: var(--tx-forte) !important;
}
.marca::before {
  content: ""; grid-row: span 2; width: 30px; height: 30px; border-radius: 8px;
  background: var(--mono-branco) center / 18px 19px no-repeat, color-mix(in srgb, var(--azul) 10%, transparent);
  box-shadow: inset 0 0 0 1px var(--hair), 0 0 16px color-mix(in srgb, var(--azul) 18%, transparent);
}
.marca span {
  display: block !important; margin-top: 2px; font: 500 9.5px/1.2 var(--mono) !important; letter-spacing: .16em !important;
  text-transform: uppercase; color: var(--azul) !important;
}
header .sair {
  background: color-mix(in srgb, var(--azul) 10%, transparent) !important; color: var(--azul2) !important;
  border: 1px solid var(--hair-on) !important; border-radius: 999px !important;
  font: 600 10.5px/1 var(--mono) !important; letter-spacing: .12em; text-transform: uppercase; padding: 9px 14px !important;
  box-shadow: 0 0 12px color-mix(in srgb, var(--azul) 15%, transparent);
}
.voltar {
  background: color-mix(in srgb, var(--azul) 6%, transparent) !important; color: var(--azul) !important;
  border: 1px solid var(--hair) !important; border-radius: 8px !important;
}


.cartao, .ps-status, .ps-caso, .ps-caminho, .ps-dobra, .pl-card, .pl-enc, .pp-card, .duvida-cx, .cartao.nps, .trancado, .tarja-deb, .ps-aprender {
  --k: var(--azul);
  --kc: color-mix(in srgb, var(--k) 55%, transparent);
  position: relative;
  background:
    linear-gradient(225deg, transparent calc(50% - .8px), var(--kc) calc(50% - .8px), var(--kc) calc(50% + .8px), transparent calc(50% + .8px)) right top / var(--corte) var(--corte) no-repeat,
    linear-gradient(45deg, transparent calc(50% - .8px), var(--kc) calc(50% - .8px), var(--kc) calc(50% + .8px), transparent calc(50% + .8px)) left bottom / var(--corte) var(--corte) no-repeat,
    radial-gradient(ellipse 80% 70% at 100% 100%, color-mix(in srgb, var(--k) 12%, transparent), transparent 70%),
    linear-gradient(180deg, var(--carta-a) 0%, var(--carta-b) 100%) !important;
  border: 1px solid color-mix(in srgb, var(--k) 34%, transparent) !important;
  border-radius: 3px !important;
  clip-path: polygon(0 0, calc(100% - var(--corte)) 0, 100% var(--corte), 100% 100%, var(--corte) 100%, 0 calc(100% - var(--corte)));
  box-shadow: inset 0 1px 0 var(--brilho-1), var(--sombra-carta) !important;
  color: var(--tx) !important;
}

.ps-status > .ps-sobre, .ps-caso > .ps-sobre, .pp-card > .ps-sobre, .ps-caminho > h3, .duvida-cx > .rotulo, .cartao > .rotulo:first-child, .ps-aprender > .rotulo {
  display: block; margin: -18px -18px 14px !important; height: 30px; box-sizing: border-box;
  padding: 0 44px 0 30px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font: 600 10px/30px var(--mono) !important; letter-spacing: .16em !important; text-transform: uppercase !important;
  color: color-mix(in srgb, var(--k) 55%, var(--tx)) !important;
  background:
    radial-gradient(circle at 16px 15px, var(--verde) 0 3px, color-mix(in srgb, var(--verde) 35%, transparent) 3.5px 6px, transparent 6.5px),
    linear-gradient(90deg, color-mix(in srgb, var(--k) 24%, transparent), color-mix(in srgb, var(--k) 8%, transparent) 65%, transparent) !important;
  box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--k) 50%, transparent);
}

.ps-status::after, .ps-caso::after, .ps-caminho::after, .pp-card::after, .duvida-cx::after {
  content: ""; position: absolute; top: 0; right: 14px; width: 30px; height: 30px; pointer-events: none;
  background: linear-gradient(145deg, var(--k), color-mix(in srgb, var(--k) 70%, var(--f)));
  box-shadow: 0 0 18px color-mix(in srgb, var(--k) 45%, transparent);
}
.ps-caso { --k: var(--petroleo); }
.ps-status { --k: var(--azul); }
.ps-caminho { --k: var(--ambar); }
.ps-dobra { --k: var(--ameixa); }
.duvida-cx { --k: var(--petroleo); }
.pl-enc { --k: var(--tx4); }
.cartao.nps { --k: var(--verde); }
.tarja-deb, .trancado { --k: var(--vermelho); }


.pl-ola, .pp-ola {
  position: relative; padding: 16px 14px 18px 18px !important; margin: 4px 0 6px !important;
  border-left: 3px solid var(--azul);
  background:
    linear-gradient(90deg, color-mix(in srgb, var(--azul) 16%, transparent), color-mix(in srgb, var(--petroleo) 6%, transparent) 45%, transparent 80%),
    repeating-linear-gradient(90deg, color-mix(in srgb, var(--azul) 35%, transparent) 0 1px, transparent 1px 8px) left bottom / 100% 5px no-repeat !important;
  box-shadow: -8px 0 24px -10px color-mix(in srgb, var(--azul) 70%, transparent);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 16px 100%, 0 calc(100% - 16px));
}
.pl-ola h2, .pp-nome, .login-topo h1, main#app > h2 {
  font-family: var(--cond) !important; font-weight: 700 !important; font-size: 40px !important; line-height: 36px !important;
  letter-spacing: .01em !important; text-transform: uppercase !important; color: var(--tx) !important;
  text-shadow: 0 0 28px var(--brilho-titulo), 0 2px 0 color-mix(in srgb, var(--f) 80%, transparent);
}
.pl-ola p, .pp-ola p, .login-topo p, main#app > h2 + .fase-desc, main#app > h2 + .pn-s {
  font-family: var(--corpo) !important; font-size: 15px !important; line-height: 1.5 !important; color: var(--tx3) !important; margin-top: 8px !important;
}
.pl-ola p::before, .pp-ola p::before, .login-topo p::before, main#app > h2 + .fase-desc::before, main#app > h2 + .pn-s::before {
  content: "Santos Lourenço/ "; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--petroleo);
}
.pl-ola p b, .pp-ola p b { color: var(--tx-forte) !important; }
.pp-ola .ps-contexto { font: 500 10.5px/1.6 var(--mono) !important; letter-spacing: .14em !important; text-transform: uppercase; color: var(--tx4) !important; }


.pl-card { padding: 18px !important; cursor: pointer; }
.pl-card::before {
  content: "PROC  \00B7  " attr(data-num);
  display: block; margin: -18px -18px 14px; height: 30px; box-sizing: border-box; padding: 0 44px 0 30px; white-space: pre; overflow: hidden;
  font: 600 10px/30px var(--mono); letter-spacing: .12em; text-transform: uppercase;
  color: color-mix(in srgb, var(--k) 55%, var(--tx));
  background:
    radial-gradient(circle at 16px 15px, var(--verde) 0 3px, color-mix(in srgb, var(--verde) 35%, transparent) 3.5px 6px, transparent 6.5px),
    linear-gradient(90deg, color-mix(in srgb, var(--k) 24%, transparent), color-mix(in srgb, var(--k) 8%, transparent) 65%, transparent);
  box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--k) 50%, transparent);
}
.pl-card::after {
  content: ""; position: absolute; top: 0; right: 14px; width: 30px; height: 30px; pointer-events: none;
  background: linear-gradient(145deg, var(--k), color-mix(in srgb, var(--k) 70%, var(--f)));
  box-shadow: 0 0 18px color-mix(in srgb, var(--k) 45%, transparent);
}
.pl-card:hover { border-color: color-mix(in srgb, var(--k) 70%, transparent) !important; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--k) 35%, transparent), inset 0 0 36px color-mix(in srgb, var(--k) 14%, transparent) !important; }
.pl-card .ps-contexto, .ps-contexto { font: 500 10.5px/1.6 var(--mono) !important; letter-spacing: .14em !important; text-transform: uppercase !important; color: var(--tx4) !important; }
.pl-nome, .ps-contra {
  font-family: var(--cond) !important; font-weight: 700 !important; font-size: 26px !important; line-height: 1.05 !important;
  letter-spacing: .015em !important; color: var(--tx-forte) !important; text-transform: uppercase !important;
}
.pl-sobre { font: 600 10px/1.4 var(--mono) !important; letter-spacing: .16em !important; color: var(--ambar) !important; }
.pl-agora b { font-family: var(--cond) !important; font-size: 21px !important; font-weight: 700 !important; color: var(--tx) !important; }
.pl-agora small { color: var(--tx3) !important; }
.pl-barra { gap: 4px !important; }
.pl-barra i { height: 6px !important; border-radius: 1px !important; background: var(--s3) !important; border: 0 !important; }

.pc-t b { display: block; font-family: var(--cond) !important; font-size: 27px; line-height: 1.1; white-space: nowrap; font-weight: 700; margin-top: 5px; font-variant-numeric: tabular-nums; color: var(--tx-forte); }

.pc-leg { display: flex; flex-direction: column; margin-top: 12px; font-size: 14px; color: var(--tx3); }
.pc-leg span { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--hair); }
.pc-leg span:last-child { border-bottom: 0; }
.pc-leg i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; margin-top: 5px; }
.pc-leg em { flex: 1; min-width: 0; font-style: normal; font-size: 14px; line-height: 1.4; color: var(--tx3); }
.pc-leg em b { font-weight: 600; color: var(--tx-forte); font-variant-numeric: tabular-nums; }
.pc-conf {
  margin-top: 18px; padding: 16px 16px 18px; border: 1px solid color-mix(in srgb, var(--ambar) 40%, transparent);
  border-left: 3px solid var(--ambar); border-radius: 3px; background: color-mix(in srgb, var(--ambar) 7%, var(--s1));
}
.pc-conf h4 { margin: 0; font: 600 10.5px/1.4 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ambar); }
.pc-conf .cab { font-size: 14px; font-weight: 700; line-height: 1.4; margin-top: 6px; color: var(--tx); }
.pc-q { padding-top: 13px; margin-top: 13px; border-top: 1px solid var(--hair); }
.pc-q label { display: block; font: 600 14px/1.45 var(--corpo) !important; letter-spacing: 0 !important; text-transform: none; color: var(--tx) !important; }
.pc-q .aj { display: block; font-size: 12.5px; color: var(--tx4); line-height: 1.45; margin-top: 3px; }
.pc-linha { display: flex; gap: 8px; margin-top: 10px; }
.pc-linha input { flex: 1; min-width: 0; font: 700 16px/1.2 var(--corpo); padding: 12px 14px; }
.pc-linha button {
  font: 600 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; padding: 12px 18px; border: 0;
  border-radius: 3px; background: var(--azul); color: var(--f); min-height: 44px; cursor: pointer;
}
.pc-selo { display: inline-block; font: 600 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; border-radius: 2px; padding: 5px 9px; margin-top: 9px; }
.pc-selo.est { background: color-mix(in srgb, var(--ambar) 16%, transparent); color: var(--ambar); }
.pc-selo.inf { background: color-mix(in srgb, var(--verde) 16%, transparent); color: var(--verde); }
.pc-aviso { font-size: 12.5px; color: var(--tx4); line-height: 1.5; margin: 9px 0 0; }


.tp-bt {
  margin-left: auto; flex: none; width: 36px; height: 36px; padding: 0; cursor: pointer;
  display: grid; place-items: center; border-radius: 999px;
  background: color-mix(in srgb, var(--azul) 10%, transparent); color: var(--azul2);
  border: 1px solid var(--hair-on); box-shadow: 0 0 12px color-mix(in srgb, var(--azul) 15%, transparent);
}
.tp-bt svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tp-bt .sol { display: none; }
html[data-tp="escuro"] .tp-bt .sol { display: block; }
html[data-tp="escuro"] .tp-bt .lua { display: none; }
header .tp-bt ~ .sair { margin-left: 0 !important; }
@media (prefers-reduced-motion: no-preference) { html.tp-trocando, html.tp-trocando * { transition: background-color .25s, color .25s, border-color .25s; } }

<script>const API="/api/portal";const VERSAO="20261028-153535";const $=s=>document.querySelector(s);let TOKEN=null,CLIENTE=null;let TEM_PAINEL=false;let PROCESSO_UNICO=false;try{TOKEN=localStorage.getItem("sl_portal_token")}catch(e){TOKEN=null}const INSTAVEL="O portal está com instabilidade agora. Tente de novo em alguns minutos.";async function api(caminho,opcoes={}){const cfg={method:opcoes.metodo||"GET",headers:{"Content-Type":"application/json"}};if(TOKEN)cfg.headers["Authorization"]="Bearer "+TOKEN;if(opcoes.corpo)cfg.body=JSON.stringify(opcoes.corpo);let r;try{r=await fetch(API+caminho,cfg)}catch(e){const x=new Error(INSTAVEL);x.status=0;throw x}if(r.status===401&&TOKEN){sair();throw new Error("sessao")}const dados=await r.json().catch((()=>({})));if(!r.ok){const tecnico=typeof dados.detail!=="string"||dados.detail==="Not Found"||r.status>=500&&r.status!==503;const x=new Error(tecnico?INSTAVEL:dados.detail);x.status=r.status;throw x}return dados}function guardarToken(t){TOKEN=t;try{localStorage.setItem("sl_portal_token",t)}catch(e){}}function sair(){TOKEN=null;CLIENTE=null;try{localStorage.removeItem("sl_portal_token")}catch(e){}telaLogin()}const ACENTOS={decisao:"decisão",decisoes:"decisões",nao:"não",justica:"justiça",audiencia:"audiência",pericia:"perícia",sentenca:"sentença",calculo:"cálculo",cobranca:"cobrança",esclareca:"esclareça",publicacao:"publicação",movimentacao:"movimentação",voce:"você",deposito:"depósito",liberacao:"liberação",contestacao:"contestação",execucao:"execução",peca:"peça",sessao:"sessão",ja:"já",tambem:"também",ate:"até",sera:"será",entao:"então",certidao:"certidão",distribuido:"distribuído",diario:"diário",cartorio:"cartório",citacao:"citação",intimacao:"intimação",notificacao:"notificação",manifestacao:"manifestação",apelacao:"apelação",homologacao:"homologação",transito:"trânsito",necessario:"necessário",possivel:"possível",informacao:"informação",orgao:"órgão"};function acentuar(t){return String(t==null?"":t).replace(/[A-Za-z]+/g
